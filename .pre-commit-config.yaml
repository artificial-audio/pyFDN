repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        exclude: "^(examples|docs)/"
        additional_dependencies:
          - numpy
          - pytest  # types pytest.mark.parametrize, which tests decorate typed functions with
          - torch

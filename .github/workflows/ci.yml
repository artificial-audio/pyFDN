name: CI

on:
  push:
    branches: [ main ]
    tags: ['*']
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIP_NO_CACHE_DIR: 1
    strategy:
      matrix:
        python-version: ['3.10', '3.14']

    steps:
    - uses: actions/checkout@v4

    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsndfile1 graphviz
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip --no-cache-dir
        pip install --no-cache-dir tox tox-gh-actions

    - name: Test with tox
      run: tox

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.python-version }}
        path: coverage.xml
        retention-days: 7

  # Mirrors the build step of .github/workflows/release.yml so packaging
  # metadata errors surface on pull requests instead of on a pushed tag, where
  # the only fix is to move the tag. README.rst is the PyPI long_description,
  # so a malformed heading in it fails twine check and blocks the release.
  # Keep the Python version in sync with release.yml.
  packaging:
    runs-on: ubuntu-latest
    env:
      PIP_NO_CACHE_DIR: 1

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip --no-cache-dir
        pip install --no-cache-dir build twine
        python -m build
        twine check dist/*

  # Guards the runtime dependency boundary: the library itself must work with
  # only its mandatory dependencies installed. Decay estimation beyond a single
  # slope (multislope/DecayFitNet) and the plotting stack belong to the example
  # environment and are exercised by the tox job above, not here.
  core-install:
    runs-on: ubuntu-latest
    env:
      PIP_NO_CACHE_DIR: 1

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libsndfile1

    - name: Build and install pyFDN wheel without optional extras
      run: |
        python -m pip install --upgrade pip --no-cache-dir
        pip install --no-cache-dir build pytest
        python -m build --wheel
        python .github/scripts/check-wheel.py dist/*.whl
        pip install --no-cache-dir dist/*.whl

    - name: Smoke-test installed wheel outside the repository
      working-directory: /tmp
      run: |
        python -c "import pyFDN; assert pyFDN.load_audio('synth_dry')[0].size; assert pyFDN.get_fdn_preset('colorless_N4_d1').build.A.shape == (4, 4); assert pyFDN.paper_reference('Allpass_Feedback_Delay_Networks')['year'] == '2021'"

    - name: Assert no decay-estimation extra was pulled in
      run: |
        for package in pyroomacoustics multislope; do
          if python -c "import $package" 2>/dev/null; then
            echo "::error::$package must not be a runtime dependency of pyFDN"
            exit 1
          fi
        done

    - name: Run core and packaged-resource tests on the bare install
      run: pytest tests/test_auxiliary_acoustics.py tests/test_packaged_resources.py -q
